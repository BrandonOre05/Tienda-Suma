<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Venta - TiendaSuma</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; }
        .logout-btn { background: rgba(255,68,68,0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; }
        h1 { color: white; margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.1); margin-bottom: 10px; border-radius: 10px; color: white; }
        .label { font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
        th { background: rgba(255,255,255,0.1); }
        .total { font-size: 1.3rem; font-weight: 700; color: #ffd700; text-align: right; margin-top: 20px; }
        .btn-back { background: rgba(255,255,255,0.3); color: white; padding: 10px 25px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; margin-right: 10px; }
        .btn-editar { background: rgba(255,193,7,0.8); color: white; padding: 10px 25px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; margin-right: 10px; }
        .btn-eliminar { background: rgba(244,67,54,0.8); color: white; padding: 10px 25px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <div class="nav-links">
        <a href="/vendedor/productos">Productos</a>
        <a href="/vendedor/ventas">Mis Ventas</a>
        <a href="/perfil">Mi Perfil</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="glass-card">
        <h1>🧾 Detalle de Venta #<span th:text="${venta.idVenta}"></span></h1>

        <div class="info-row">
            <span class="label">Fecha:</span>
            <span th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></span>
        </div>
        <div class="info-row">
            <span class="label">Cliente ID:</span>
            <span th:text="${venta.usuariosIdUsuario}"></span>
        </div>
        <div class="info-row">
            <span class="label">Vendedor ID:</span>
            <span th:text="${venta.vendedorIdUsuario}"></span>
        </div>

        <h3 style="color: white; margin: 20px 0 10px 0;">Productos</h3>
        <table>
            <thead>
            <tr>
                <th>Producto ID</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="detalle : ${detalles}">
                <td th:text="${detalle.productosIdProducto}"></td>
                <td th:text="${detalle.cantidad}"></td>
                <td th:text="'Q ' + ${detalle.precioUnitario}"></td>
                <td th:text="'Q ' + ${detalle.precioUnitario * detalle.cantidad}"></td>
            </tr>
            </tbody>
        </table>
        <div class="total" th:text="'Total: Q ' + ${total}"></div>

        <div>
            <a href="/vendedor/ventas" class="btn-back">← Volver a Ventas</a>
            <a th:href="@{/vendedor/ventas/editar/{id}(id=${venta.idVenta})}" class="btn-editar">✏️ Editar Venta</a>
            <a th:href="@{/vendedor/ventas/eliminar/{id}(id=${venta.idVenta})}" class="btn-eliminar" onclick="return confirm('¿Eliminar esta venta?')">🗑️ Eliminar Venta</a>
        </div>
    </div>
</div>
</body>
</html>
