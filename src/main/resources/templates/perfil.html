<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - TiendaSuma</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .navbar { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; }
        .logout-btn { background: rgba(255,68,68,0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; }
        h2 { color: white; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { color: white; display: block; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.9); font-family: 'Poppins', sans-serif; }
        input:read-only { background: rgba(255,255,255,0.5); cursor: not-allowed; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-back { background: rgba(255,255,255,0.3); margin-bottom: 15px; display: inline-block; padding: 8px 20px; border-radius: 10px; text-decoration: none; color: white; }
        .alert-success { background: rgba(76,175,80,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .alert-error { background: rgba(244,67,54,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .badge-role { background: rgba(255,255,255,0.3); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-bottom: 20px; color: white; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <div class="nav-links">
        <a href="/admin/productos">Productos</a>
        <a href="/admin/categorias">Categorías</a>
        <a href="/admin/proveedores">Proveedores</a>
        <a href="/admin/usuarios">Usuarios</a>
        <a href="/ventas">Ventas</a>
        <a href="/perfil">Mi Perfil</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="glass-card">
        <a href="/home" class="btn-back">← Volver al Inicio</a>
        <h2>👤 Mi Perfil</h2>

        <div th:if="${success}" class="alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <div style="text-align: center;">
            <span class="badge-role" th:text="'Rol: ' + ${usuario.rol}"></span>
        </div>

        <form th:action="@{/perfil/actualizar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" name="nombre" th:value="${usuario.nombre}" required>
                </div>
                <div class="form-group">
                    <label>Apellido *</label>
                    <input type="text" name="apellido" th:value="${usuario.apellido}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:value="${usuario.email}" readonly>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" name="telefono" th:value="${usuario.telefono}" placeholder="12345678">
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" name="direccion" th:value="${usuario.direccion}" placeholder="Tu dirección">
                </div>
            </div>

            <div class="form-group">
                <label>Nueva Contraseña (opcional)</label>
                <input type="password" name="nuevaPassword" placeholder="Dejar vacío para mantener actual">
            </div>

            <button type="submit" class="btn">Actualizar Perfil</button>
        </form>
    </div>
</div>
</body>
</html>
