<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Compra - TiendaSuma</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .navbar { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-radius: 15px; }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; }
        .logout-btn { background: rgba(255,68,68,0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; }
        h2 { color: white; margin-bottom: 20px; }
        .info-compra { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .info-compra p { color: white; margin: 5px 0; }
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .producto-item { background: rgba(255,255,255,0.15); border-radius: 15px; padding: 20px; transition: transform 0.3s; }
        .producto-item:hover { transform: translateY(-3px); background: rgba(255,255,255,0.25); }
        .producto-nombre { color: white; font-size: 1.2rem; font-weight: 600; }
        .producto-precio { color: #ffd700; font-size: 1.3rem; margin: 10px 0; }
        .producto-stock { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 15px; }
        .cantidad-input { width: 80px; padding: 8px; border: none; border-radius: 10px; text-align: center; font-size: 1rem; }
        .cantidad-actual { color: #ffd700; font-size: 0.85rem; margin-top: 5px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 30px; font-size: 1.1rem; }
        .btn:hover { transform: translateY(-2px); }
        .btn-back { background: rgba(255,255,255,0.3); width: auto; padding: 8px 20px; text-decoration: none; display: inline-block; margin-bottom: 20px; color: white; border-radius: 10px; }
        .alert-error { background: rgba(244,67,54,0.9); padding: 12px; border-radius: 10px; margin-bottom: 20px; color: white; }
        label { color: white; display: block; margin-bottom: 8px; font-weight: 500; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <div class="nav-links">
        <a href="/cliente/productos">Productos</a>
        <a href="/cliente/compras">Mis Compras</a>
        <a href="/perfil">Mi Perfil</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="glass-card">
        <a href="/cliente/compras" class="btn-back">← Mis Compras</a>
        <h2>✏️ Editar Compra #<span th:text="${compra.idCompra}"></span></h2>

        <div class="info-compra">
            <p><strong>Fecha:</strong> <span th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p><strong>Total actual:</strong> <span th:text="'Q ' + ${compra.total}"></span></p>
        </div>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form method="post" th:action="@{/cliente/compras/actualizar/{id}(id=${compra.idCompra})}">
            <h3 style="color: white; margin-bottom: 15px;">📦 Selecciona los productos y cantidades</h3>
            <div class="productos-grid">
                <div class="producto-item" th:each="producto : ${productos}">
                    <div class="producto-nombre" th:text="${producto.nombreProducto}"></div>
                    <div class="producto-precio" th:text="'Q ' + ${producto.precio}"></div>
                    <div class="producto-stock" th:text="'Stock disponible: ' + ${producto.stock}"></div>
                    <label>Cantidad a comprar:</label>
                    <input type="number" th:name="'producto_' + ${producto.idProducto}" class="cantidad-input" min="0" th:max="${producto.stock}" value="0">
                    <div class="cantidad-actual" th:each="detalle : ${detalles}" th:if="${detalle.productosIdProducto == producto.idProducto and detalle.cantidad > 0}">
                        Cantidad anterior: <span th:text="${detalle.cantidad}"></span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn">💾 Guardar Cambios</button>
        </form>
    </div>
</div>
</body>
</html>
