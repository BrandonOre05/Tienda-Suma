<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Compras - TiendaSuma</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; }
        .logout-btn { background: rgba(255,68,68,0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; }
        h2 { color: white; margin-bottom: 20px; }
        .btn-nuevo { background: rgba(76,175,80,0.8); color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .btn-nuevo:hover { background: rgba(76,175,80,1); }
        table { width: 100%; border-collapse: collapse; color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
        th { background: rgba(255,255,255,0.1); font-weight: 600; }
        .btn-ver { background: rgba(33,150,243,0.8); color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; display: inline-block; margin-right: 5px; }
        .btn-editar { background: rgba(255,193,7,0.8); color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; display: inline-block; margin-right: 5px; }
        .btn-eliminar { background: rgba(244,67,54,0.8); color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .alert-success { background: rgba(76,175,80,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .alert-error { background: rgba(244,67,54,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <div class="nav-links">
        <a href="/cliente/productos">Productos</a>
        <a href="/cliente/compras">Mis Compras</a>
        <a href="/perfil">Mi Perfil</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="glass-card">
        <h2>📋 Mis Compras</h2>

        <div th:if="${success}" class="alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <a href="/cliente/compras/nueva" class="btn-nuevo">+ Realizar Nueva Compra</a>

        <div th:if="${not #lists.isEmpty(compras)}">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="compra : ${compras}">
                    <td th:text="${compra.idCompra}"></td>
                    <td th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="'Q ' + ${compra.total}"></td>
                    <td>
                        <a th:href="@{/cliente/compras/detalle/{id}(id=${compra.idCompra})}" class="btn-ver">Ver</a>
                        <a th:href="@{/cliente/compras/editar/{id}(id=${compra.idCompra})}" class="btn-editar">Editar</a>
                        <a th:href="@{/cliente/compras/eliminar/{id}(id=${compra.idCompra})}" class="btn-eliminar" onclick="return confirm('¿Eliminar esta compra?')">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${#lists.isEmpty(compras)}" style="color: white; text-align: center; margin-top: 30px;">No has realizado compras aún. <a href="/cliente/compras/nueva" style="color: #ffd700;">¡Compra ahora!</a></p>
    </div>
</div>
</body>
</html>
