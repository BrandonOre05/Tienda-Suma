<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${proveedor.idProveedor != null} ? 'Editar Proveedor' : 'Nuevo Proveedor'">Proveedor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; width: 100%; max-width: 600px; }
        h1 { color: white; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { color: white; display: block; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.9); font-family: 'Poppins', sans-serif; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-back { background: rgba(255,255,255,0.3); margin-bottom: 15px; display: inline-block; padding: 8px 20px; border-radius: 10px; text-decoration: none; color: white; }
        .error-message { color: #ffcccc; font-size: 0.75rem; margin-top: 5px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
<div class="glass-card">
    <a href="/admin/proveedores" class="btn-back">← Volver</a>
    <h1 th:text="${proveedor.idProveedor != null} ? '✏️ Editar Proveedor' : '➕ Nuevo Proveedor'"></h1>
    <form th:action="@{/admin/proveedores/guardar}" th:object="${proveedor}" method="post">
        <input type="hidden" th:field="*{idProveedor}">
        <input type="hidden" th:field="*{estado}">
        <div class="form-group">
            <label>Nombre *</label>
            <input type="text" th:field="*{nombreProveedor}" required>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Teléfono</label><input type="tel" th:field="*{telefono}"></div>
            <div class="form-group"><label>Email</label><input type="email" th:field="*{email}"></div>
        </div>
        <div class="form-group"><label>Dirección</label><input type="text" th:field="*{direccion}"></div>
        <button type="submit" class="btn">Guardar Proveedor</button>
    </form>
</div>
</body>
</html>
