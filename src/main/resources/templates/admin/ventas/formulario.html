<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${venta.idVenta != null} ? 'Editar Venta' : 'Nueva Venta'">Venta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .navbar { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-radius: 15px; }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .logout-btn { background: rgba(255,68,68,0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; }
        h2 { color: white; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { color: white; display: block; margin-bottom: 8px; font-weight: 500; }
        select, input { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.9); font-family: 'Poppins', sans-serif; }
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .producto-item { background: rgba(255,255,255,0.15); border-radius: 15px; padding: 15px; }
        .producto-nombre { color: white; font-weight: 600; }
        .producto-precio { color: #ffd700; margin: 10px 0; }
        .producto-stock { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 10px; }
        .cantidad-input { width: 80px; padding: 8px; text-align: center; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn-back { background: rgba(255,255,255,0.3); width: auto; padding: 8px 20px; text-decoration: none; display: inline-block; margin-bottom: 20px; color: white; border-radius: 10px; }
        .alert-error { background: rgba(244,67,54,0.9); padding: 12px; border-radius: 10px; margin-bottom: 20px; color: white; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn">Cerrar Sesión</button></form>
</nav>

<div class="container">
    <div class="glass-card">
        <a href="/admin/ventas" class="btn-back">← Volver</a>
        <h2 th:text="${venta.idVenta != null} ? '✏️ Editar Venta' : '➕ Nueva Venta'"></h2>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form method="post" th:action="@{/admin/ventas/guardar}">
            <input type="hidden" name="idVenta" th:value="${venta.idVenta}">

            <div class="form-row">
                <div class="form-group">
                    <label>Cliente *</label>
                    <select name="usuariosIdUsuario" required>
                        <option value="">-- Seleccione un cliente --</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.idUsuario}"
                                th:text="${cliente.nombre} + ' ' + ${cliente.apellido}"
                                th:selected="${venta.usuariosIdUsuario == cliente.idUsuario}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Vendedor *</label>
                    <select name="vendedorIdUsuario" required>
                        <option value="">-- Seleccione un vendedor --</option>
                        <option th:each="vendedor : ${vendedores}" th:value="${vendedor.idUsuario}"
                                th:text="${vendedor.nombre} + ' ' + ${vendedor.apellido}"
                                th:selected="${venta.vendedorIdUsuario == vendedor.idUsuario}"></option>
                    </select>
                </div>
            </div>

            <h3 style="color: white; margin: 20px 0 15px 0;">📦 Productos</h3>
            <div class="productos-grid">
                <div class="producto-item" th:each="producto : ${productos}" th:if="${producto.estado}">
                    <div class="producto-nombre" th:text="${producto.nombreProducto}"></div>
                    <div class="producto-precio" th:text="'Q ' + ${producto.precio}"></div>
                    <div class="producto-stock" th:text="'Stock disponible: ' + ${producto.stock}"></div>
                    <label>Cantidad:</label>
                    <input type="number" th:name="'producto_' + ${producto.idProducto}" class="cantidad-input" min="0" th:max="${producto.stock}" value="0">
                </div>
            </div>

            <button type="submit" class="btn">Guardar Venta</button>
        </form>
    </div>
</div>
</body>
</html>
