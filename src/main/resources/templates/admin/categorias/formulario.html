<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${categoria.idCategoria != null} ? 'Editar Categoría' : 'Nueva Categoría'">Categoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; }
        h1 { color: white; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { color: white; display: block; margin-bottom: 8px; font-weight: 500; }
        input, textarea { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.9); font-family: 'Poppins', sans-serif; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-back { background: rgba(255,255,255,0.3); margin-bottom: 15px; display: inline-block; padding: 8px 20px; border-radius: 10px; text-decoration: none; color: white; }
        .error-message { color: #ffcccc; font-size: 0.75rem; margin-top: 5px; }
    </style>
</head>
<body>
<div class="glass-card">
    <a href="/admin/categorias" class="btn-back">← Volver</a>
    <h1 th:text="${categoria.idCategoria != null} ? '✏️ Editar Categoría' : '➕ Nueva Categoría'"></h1>
    <form th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="post">
        <input type="hidden" th:field="*{idCategoria}">
        <div class="form-group">
            <label>Nombre *</label>
            <input type="text" th:field="*{nombreCategoria}" required>
            <div th:if="${#fields.hasErrors('nombreCategoria')}" class="error-message" th:errors="*{nombreCategoria}"></div>
        </div>
        <div class="form-group">
            <label>Descripción</label>
            <textarea th:field="*{descripcion}" rows="4"></textarea>
        </div>
        <button type="submit" class="btn">Guardar Categoría</button>
    </form>
</div>
</body>
</html>
