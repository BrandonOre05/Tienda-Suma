<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .logout-btn { background: rgba(255,68,68,0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; }
        h2 { color: white; margin-bottom: 20px; }
        .btn-nuevo { background: rgba(76,175,80,0.8); color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
        th { background: rgba(255,255,255,0.1); }
        .btn-editar { background: rgba(33,150,243,0.8); padding: 6px 12px; border-radius: 8px; text-decoration: none; color: white; margin-right: 5px; }
        .btn-eliminar { background: rgba(244,67,54,0.8); padding: 6px 12px; border-radius: 8px; text-decoration: none; color: white; }
        .alert-success { background: rgba(76,175,80,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn">Cerrar Sesión</button></form>
</nav>
<div class="container">
    <div class="glass-card">
        <h2>🏷️ Categorías</h2>
        <div th:if="${success}" class="alert-success" th:text="${success}"></div>
        <a href="/admin/categorias/nuevo" class="btn-nuevo">+ Nueva Categoría</a>
        <table>
            <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.idCategoria}"></td>
                <td th:text="${cat.nombreCategoria}"></td>
                <td th:text="${cat.descripcion}"></td>
                <td>
                    <a th:href="@{/admin/categorias/editar/{id}(id=${cat.idCategoria})}" class="btn-editar">Editar</a>
                    <a th:href="@{/admin/categorias/eliminar/{id}(id=${cat.idCategoria})}" class="btn-eliminar" onclick="return confirm('¿Eliminar categoría?')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
