<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.idUsuario != null} ? 'Editar Usuario' : 'Nuevo Usuario'">Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .glass-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; width: 100%; max-width: 700px; }
        h1 { color: white; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { color: white; display: block; margin-bottom: 8px; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.9); font-family: 'Poppins', sans-serif; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-back { background: rgba(255,255,255,0.3); margin-bottom: 15px; display: inline-block; padding: 8px 20px; border-radius: 10px; text-decoration: none; color: white; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .alert-error { background: rgba(244,67,54,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .alert-success { background: rgba(76,175,80,0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        small { color: rgba(255,255,255,0.7); font-size: 0.7rem; display: block; margin-top: 5px; }
    </style>
</head>
<body>
<div class="glass-card">
    <a href="/admin/usuarios" class="btn-back">← Volver</a>
    <h1 th:text="${usuario.idUsuario != null} ? '✏️ Editar Usuario' : '➕ Nuevo Usuario'"></h1>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{idUsuario}">

        <div class="form-row">
            <div class="form-group">
                <label>Nombre *</label>
                <input type="text" th:field="*{nombre}" required>
            </div>
            <div class="form-group">
                <label>Apellido *</label>
                <input type="text" th:field="*{apellido}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" th:field="*{telefono}">
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Rol *</label>
                <select th:field="*{rol}" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="form-group" th:if="${usuario.idUsuario != null}">
                <label>Estado</label>
                <select th:field="*{estado}">
                    <option th:value="true">Activo</option>
                    <option th:value="false">Inactivo</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label th:text="${usuario.idUsuario != null} ? 'Nueva Contraseña (opcional)' : 'Contraseña *'"></label>
            <input type="password" th:field="*{password}" th:required="${usuario.idUsuario == null}" placeholder="Mínimo 8 caracteres">
            <small th:if="${usuario.idUsuario == null}">La contraseña debe tener al menos 8 caracteres</small>
            <small th:if="${usuario.idUsuario != null}">Dejar vacío para mantener la contraseña actual</small>
        </div>

        <button type="submit" class="btn">Guardar Usuario</button>
    </form>
</div>
</body>
</html>
