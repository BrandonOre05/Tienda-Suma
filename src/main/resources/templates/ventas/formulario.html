<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta - TiendaSuma</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 15px;
        }
        .logo { color: white; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .logout-btn { background: rgba(255, 68, 68, 0.7); color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; margin-bottom: 30px; }
        h2 { color: white; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: white; margin-bottom: 8px; font-weight: 500; }
        select, input { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255, 255, 255, 0.9); font-size: 1rem; }
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .producto-item { background: rgba(255, 255, 255, 0.15); border-radius: 15px; padding: 15px; }
        .producto-nombre { color: white; font-weight: 600; }
        .producto-precio { color: #ffd700; margin: 10px 0; }
        .producto-stock { color: rgba(255, 255, 255, 0.7); font-size: 0.85rem; margin-bottom: 10px; }
        .cantidad-input { width: 80px; padding: 8px; text-align: center; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #667eea, #764ba2); color: white; margin-top: 20px; }
        .btn:hover { transform: translateY(-2px); }
        .btn-back { background: rgba(255, 255, 255, 0.3); width: auto; padding: 8px 20px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .alert-error { background: rgba(244, 67, 54, 0.9); color: white; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/home" class="logo">🛍️ TiendaSuma</a>
    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="logout-btn">Cerrar Sesión</button>
    </form>
</nav>

<div class="container">
    <div class="glass-card">
        <a th:href="@{/ventas}" class="btn btn-back">← Volver</a>
        <h2>🛒 Nueva Venta</h2>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form method="post" th:action="@{/ventas/guardar}">
            <div class="form-group">
                <label>Cliente *</label>
                <select name="clienteId" required>
                    <option value="">Seleccionar cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.idUsuario}" th:text="${cliente.nombre} + ' ' + ${cliente.apellido} + ' - ' + ${cliente.email}"></option>
                </select>
            </div>

            <h3 style="color: white; margin: 20px 0 15px 0;">Productos</h3>
            <div class="productos-grid">
                <div class="producto-item" th:each="producto : ${productos}" th:if="${producto.estado and producto.stock > 0}">
                    <div class="producto-nombre" th:text="${producto.nombreProducto}"></div>
                    <div class="producto-precio" th:text="'Q ' + ${producto.precio}"></div>
                    <div class="producto-stock" th:text="'Stock disponible: ' + ${producto.stock}"></div>
                    <label>Cantidad:</label>
                    <input type="number" th:name="'producto_' + ${producto.idProducto}" class="cantidad-input" min="0" th:max="${producto.stock}" value="0">
                </div>
            </div>

            <button type="submit" class="btn">Registrar Venta</button>
        </form>
    </div>
</div>
</body>
</html>
